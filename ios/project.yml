name: BluePhoenix
options:
  bundleIdPrefix: com.astrodev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio
    from: 1.33.1
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl
    from: 2.27.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: JUQ9UN9NM7
    CODE_SIGN_STYLE: Automatic
targets:
  BluePhoenix:
    type: application
    platform: iOS
    sources:
      - BluePhoenix
    dependencies:
      - package: PostgresNIO
        product: PostgresNIO
      - package: swift-nio-ssl
        product: NIOSSL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astrodev.bluephoenix.ios
        PRODUCT_NAME: BluePhoenix
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BluePhoenix
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
