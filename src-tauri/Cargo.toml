[package]
name = "bluephoenix"
version = "0.2.1"
description = "BluePhoenix: project manager for developers"
authors = ["AstroDev"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bluephoenix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = "0.4.45"
tokio = { version = "1.53.3", features = ["full"] }
futures-util = "0.3.34"
ignore = "0.4.33"
semver = "1.0.28"
thiserror = "2.0.21"
dirs = "7.0.0"
which = "8.0.6"
toml = "1.1.8"
regex = "1.13.1"
window-vibrancy = "0.8.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
base64 = "0.23.1"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
webpki-roots = "1.0.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }


[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
